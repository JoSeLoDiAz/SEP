# SEP — PRE nginx (pre-sep.sena.edu.co → FE 127.0.0.1:8096 / API 127.0.0.1:8097)
server {
    listen 80;
    listen [::]:80;
    server_name pre-sep.sena.edu.co;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    include /etc/nginx/snippets/pre-ssl-params.conf;
    server_name pre-sep.sena.edu.co;
    include /etc/nginx/snippets/pre-publish-ca.conf;

    client_max_body_size 20m;

    error_page 502 503 504 /sena-errors/mantenimiento-sena.html;

    location = /sena-errors/mantenimiento-sena.html {
        root /var/www;
        internal;
    }

    location = /sena-errors/logo-sena.png {
        root /var/www;
        access_log off;
    }

    location = /sena-errors/tecnico-servidor-sena.png {
        root /var/www;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8097/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
    }
}
