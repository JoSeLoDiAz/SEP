services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sep_frontend
    restart: unless-stopped
    environment:
      # el host esta en UTC y Oracle guarda hora de Bogota: sin esto las fechas se corren un dia
      TZ: America/Bogota
    networks:
      - sep-internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sep_backend
    restart: unless-stopped
    environment:
      TZ: America/Bogota
    env_file:
      - backend/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "relay.sena.edu.co:172.30.163.235"
    networks:
      - sep-internal

  nginx:
    image: nginx:stable-alpine
    container_name: sep_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - sep-internal

networks:
  sep-internal:
    driver: bridge
