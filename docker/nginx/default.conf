# OJO al desplegar: nginx resuelve estos nombres UNA sola vez, al arrancar. Al
# recrear los contenedores docker les da una IP nueva y nginx sigue apuntando a
# la vieja, asi que el sitio contesta 502 hasta que se recargue. Por eso el
# despliegue tiene que terminar con "nginx -s reload" — lo hace desplegar.sh.
# (El parametro `resolve` del upstream, que lo arreglaria solo, es de NGINX Plus.)
upstream frontend {
    server frontend:3000;
    keepalive 4;
}

upstream backend {
    server backend:4000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # Permitir subidas grandes (fotos hasta 4MB, PDFs hasta 8MB, JSON grande
    # hasta 20MB). El backend valida su propio limite; nginx no debe cortar antes.
    client_max_body_size 20M;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los bloques upstream de arriba declaran `keepalive`, y para que eso
        # sirva de algo nginx tiene que hablar HTTP/1.1 con el contenedor y no
        # mandarle `Connection: close`. Sin estas dos lineas la conexion se
        # rehace en cada peticion: mas lento, y una fuente conocida de cortes
        # a mitad de respuesta.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sin buffering. Por aqui salen las fotos, las cedulas, los correos de
        # autorizacion y los certificados: archivos de cientos de kB. Con el
        # buffering por defecto nginx los guarda enteros —en memoria y, al
        # pasarse de 32 kB, en un archivo temporal en disco— antes de empezar a
        # mandarlos, y si el cliente va lento por el camino se le agota el
        # tiempo a media entrega y el navegador recibe la respuesta cortada:
        # 200 OK con el cuerpo incompleto, que es como se veia el fallo.
        # Apagado, cada trozo sale hacia el navegador segun llega.
        proxy_buffering off;

        # Margen para redes lentas. Los valores por defecto (60 s) se quedaban
        # cortos con un adjunto grande desde una conexion mala.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
