# OJO al desplegar: nginx resuelve estos nombres UNA sola vez, al arrancar. Al
# recrear los contenedores docker les da una IP nueva y nginx sigue apuntando a
# la vieja, asi que el sitio contesta 502 hasta que se recargue. Por eso el
# despliegue tiene que terminar con "nginx -s reload" — lo hace desplegar.sh.
# (El parametro `resolve` del upstream, que lo arreglaria solo, es de NGINX Plus.)
upstream frontend {
    server frontend:3000;
    keepalive 4;
}

upstream backend {
    server backend:4000;
    keepalive 4;
}

server {
    listen 80;
    server_name _;

    # Deliberadamente MAS ALTO que el tope de la aplicacion, que es de 8 MB por
    # archivo. Quien corta tiene que ser el backend, porque es el unico que
    # puede explicar por que: "El archivo es demasiado grande. El maximo
    # permitido es 8 MB". Si nginx cortara primero, el navegador recibiria un
    # 413 con una pagina de nginx en ingles y sin contexto, despues de haber
    # subido el archivo entero.
    #
    # Los 20M cubren ademas los cuerpos JSON grandes (analisis, eslabones), que
    # el backend acepta hasta ese tamano y no son archivos.
    client_max_body_size 20M;

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los bloques upstream de arriba declaran `keepalive`, y para que eso
        # sirva de algo nginx tiene que hablar HTTP/1.1 con el contenedor y no
        # mandarle `Connection: close`. Sin estas dos lineas la conexion se
        # rehace en cada peticion: mas lento, y una fuente conocida de cortes
        # a mitad de respuesta.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # API
    location /api/ {
        proxy_pass http://backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # El buffering se queda ENCENDIDO (el valor por defecto de nginx).
        #
        # Estuvo apagado unas horas, buscando un fallo que cortaba las descargas
        # a medias. No era eso: era el backend, que ponia una cabecera sobre una
        # respuesta ya enviada. Apagarlo no solo no ayudaba — estorbaba, porque
        # sin buffering el proceso Node tiene que sostener el archivo entero en
        # memoria hasta que el navegador termine de leerlo, al ritmo de la red
        # de quien descarga. Encendido, nginx se lo lleva a velocidad de red
        # local, libera el backend enseguida y ya se encarga el de alimentar al
        # cliente lento.
        #
        # Con el tope de 8 MB por archivo, lo que nginx pueda volcar a un
        # temporal es despreciable.

        # Margen para redes lentas. Los valores por defecto (60 s) se quedaban
        # cortos con un adjunto grande desde una conexion mala.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
